name: Metrics

on:
  schedule:
    # Runs every day at 00:00 UTC — adjust as you like
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

          # --- Layout: base sections ---
          # header       -> avatar, name, bio
          # activity     -> "activity terbaru" (recent commits/issues/PRs)
          # community    -> "community stats" (issues opened/closed, PR merged, discussions)
          # repositories -> pinned/starred repos summary
          base: header, activity, community, repositories

          # --- Plugin: calendar heatmap ---
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # --- Plugin: top languages ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8

          # --- Theming (dark + red accent, biar konsisten dengan README) ---
          config_theme: dark
          config_timezone: Asia/Jakarta
          extras_css: |
            :root {
              --color-calendar-graph-day-L4-bg: #E63946 !important;
              --color-calendar-graph-day-L3-bg: #b3202b !important;
              --color-calendar-graph-day-L2-bg: #6e1319 !important;
              --color-prettylights-syntax-constant: #E63946 !important;
            }
